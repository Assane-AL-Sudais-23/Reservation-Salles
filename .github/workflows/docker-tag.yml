name: Docker Image Tagging & Build

# Se déclenche uniquement lorsqu'un tag respectant le format v*.*.* est poussé sur GitHub
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source du dépôt Git
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : Extraire le nom du tag Git (ex: v1.0.0)
      - name: Extraire le nom du tag Git
        id: vars
        run: echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # Étape 3 : Configurer Docker Buildx
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape 4 : Connexion à Docker Hub via tes secrets GitHub
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Étape 5 : Build et Push de l'image sur Docker Hub
      - name: Build et Push vers Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/php/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reservation-salles-app:${{ env.GIT_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/reservation-salles-app:latest